name: Apply TURTI content refresh

on:
  push:
    branches:
      - content-refresh-safe3

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout safe branch
        uses: actions/checkout@v4
        with:
          ref: content-refresh-safe3

      - name: Apply requested changes
        run: python3 scripts/apply_content_refresh.py

      - name: Verify changes
        run: |
          git diff --check
          grep -q 'Все урбечи · 12 вкусов' index.html
          grep -q '25+' index.html
          grep -q 'name: "Три ореха"' index.html

      - name: Commit safe refresh
        run: |
          git config user.name "TURTI content bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html about.html lib/catalog.js
          if git diff --cached --quiet; then
            echo "No content changes needed"
          else
            git commit -m "Refresh TURTI flavors and 25+ years positioning"
            git push origin HEAD:content-refresh-safe3
          fi
